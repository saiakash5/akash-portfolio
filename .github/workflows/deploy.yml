name: Deploy

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/deploy.yml"]
  workflow_dispatch: {}

permissions:
  id-token: write # OIDC token for AWS role assumption — no stored AWS keys
  contents: read

env:
  AWS_REGION: us-east-1
  S3_BUCKET: akash-portfolio-frontend-20260615205418964000000002
  CF_DISTRIBUTION: E2UXJQE0WRIOZP

# Frontend-only deploy. Backend is fully serverless (Lambda/API Gateway/
# DynamoDB) and deployed via `terraform apply` — Lambda code changes go out
# with Terraform, not here.
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::871716941934:role/akash-portfolio-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci && npm run build
        working-directory: frontend

      - name: Deploy frontend
        run: |
          aws s3 sync frontend/dist s3://$S3_BUCKET --delete
          aws cloudfront create-invalidation --distribution-id $CF_DISTRIBUTION --paths "/*" --no-cli-pager --query Invalidation.Status
