# Local development: run both backend services in containers.
# Frontend runs separately with `npm run dev` (it proxies /api to these ports).
#
#   docker compose up --build

services:
  profile-service:
    build: ./services/profile-service
    ports:
      - "8080:8080"

  contact-service:
    build: ./services/contact-service
    ports:
      - "8001:8001"
    # TABLE_NAME intentionally unset locally — messages are logged, not stored.
